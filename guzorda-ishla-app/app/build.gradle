plugins {
    id 'com.android.application'
}

android {
    namespace 'uz.guzorda.ishla'
    compileSdk 35

    defaultConfig {
        applicationId 'uz.guzorda.ishla'
        minSdk 26
        targetSdk 35
        versionCode((System.getenv('BUILD_NUMBER') ?: '1') as int)
        versionName "1.0.${System.getenv('BUILD_NUMBER') ?: '0'}"
    }

    signingConfigs {
        release {
            // CI'da GitHub Secrets orqali beriladi; bo'lmasa debug kalit bilan imzolanadi
            def ks = System.getenv('KEYSTORE_FILE')
            if (ks != null && file(ks).exists()) {
                storeFile file(ks)
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
            } else {
                def dbg = signingConfigs.debug
                storeFile dbg.storeFile
                storePassword dbg.storePassword
                keyAlias dbg.keyAlias
                keyPassword dbg.keyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
