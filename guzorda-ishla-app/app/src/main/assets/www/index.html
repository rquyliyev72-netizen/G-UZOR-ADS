<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>G‘uzorda Ishla</title>
<style>
  :root {
    --bg: #161b21; --bg2: #0c0f13; --card: #1e242c; --card2: #252c35;
    --line: #2e3640; --text: #ffffff; --muted: #a3acb8;
    --yellow: #ffcc00; --yellow-deep: #e8a800; --ink: #1a1a1c; --green: #3ccf7a;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { padding-bottom: 76px; min-height: 100vh;
    background: linear-gradient(var(--bg), var(--bg2)) fixed; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; border: 0; background: none; }

  header { padding: 18px 16px 10px; position: sticky; top: 0; z-index: 5;
    background: rgba(22,27,33,.96); backdrop-filter: blur(8px); }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand svg { width: 42px; height: 42px; flex: none; }
  .brand h1 { margin: 0; font-size: 22px; font-weight: 900; letter-spacing: .3px; }
  .brand h1 span { color: var(--yellow); }
  .brand p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }

  .search { margin-top: 14px; position: relative; }
  .search input { width: 100%; padding: 13px 14px 13px 42px; border-radius: 14px;
    border: 1px solid var(--line); background: var(--card); outline: none; font-size: 15px; }
  .search input:focus { border-color: var(--yellow); }
  .search svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
    width: 18px; height: 18px; stroke: var(--muted); }
  .chips { display: flex; gap: 8px; overflow-x: auto; padding: 12px 0 2px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: none; padding: 8px 14px; border-radius: 999px; background: var(--card);
    border: 1px solid var(--line); color: var(--muted); font-size: 14px; font-weight: 600; }
  .chip.on { background: var(--yellow); border-color: var(--yellow); color: var(--ink); }

  main { padding: 6px 16px 16px; }
  .meta { color: var(--muted); font-size: 13px; margin: 6px 2px 10px;
    display: flex; justify-content: space-between; gap: 8px; }
  .job { display: block; width: 100%; text-align: left; background: var(--card);
    border: 1px solid var(--line); border-radius: 18px; padding: 16px; margin-bottom: 12px;
    position: relative; }
  .job:active { background: var(--card2); }
  .job h3 { margin: 0 70px 4px 0; font-size: 17px; font-weight: 800; line-height: 1.25; }
  .job .co { color: var(--muted); font-size: 14px; }
  .salary { color: var(--yellow); font-weight: 800; font-size: 15px; margin: 10px 0 8px; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .tag { font-size: 12px; padding: 5px 9px; border-radius: 8px; background: var(--bg);
    color: var(--muted); border: 1px solid var(--line); }
  .badge { position: absolute; top: 14px; right: 14px; font-size: 11px; font-weight: 900;
    padding: 4px 8px; border-radius: 8px; background: var(--yellow); color: var(--ink); letter-spacing: .5px; }
  .badge.sample { background: var(--line); color: var(--muted); }
  .empty { text-align: center; color: var(--muted); padding: 48px 16px; }
  .empty b { display: block; color: var(--text); font-size: 17px; margin-bottom: 6px; }

  nav { position: fixed; left: 0; right: 0; bottom: 0; display: flex; z-index: 6;
    background: #11151a; border-top: 1px solid var(--line);
    padding-bottom: env(safe-area-inset-bottom); }
  nav button { flex: 1; padding: 10px 4px 12px; color: var(--muted); font-size: 12px;
    font-weight: 600; display: flex; flex-direction: column; align-items: center; gap: 4px; }
  nav button svg { width: 22px; height: 22px; stroke: currentColor; }
  nav button.on { color: var(--yellow); }

  .sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 10;
    opacity: 0; pointer-events: none; transition: opacity .2s; }
  .sheet-bg.open { opacity: 1; pointer-events: auto; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 11; max-height: 92vh;
    overflow-y: auto; background: var(--bg); border-radius: 22px 22px 0 0;
    border-top: 1px solid var(--line); padding: 10px 18px 24px;
    transform: translateY(100%); transition: transform .25s ease-out; }
  .sheet.open { transform: none; }
  .grip { width: 44px; height: 5px; border-radius: 3px; background: var(--line); margin: 0 auto 14px; }
  .sheet h2 { margin: 0 0 4px; font-size: 22px; font-weight: 900; }
  .sheet .co { color: var(--muted); }
  .rows { margin: 14px 0; display: grid; gap: 10px; }
  .row { display: flex; gap: 10px; align-items: flex-start; background: var(--card);
    border-radius: 12px; padding: 11px 12px; font-size: 14px; }
  .row small { display: block; color: var(--muted); font-size: 12px; }
  .sheet h4 { margin: 18px 0 6px; font-size: 15px; }
  .sheet p, .sheet li { color: #d6dbe1; line-height: 1.5; font-size: 15px; }
  .sheet ul { margin: 0; padding-left: 20px; }
  .note { font-size: 13px; color: var(--muted); background: var(--card); border-radius: 12px;
    padding: 10px 12px; margin-top: 14px; }
  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 18px; }
  .btn { padding: 14px; border-radius: 14px; font-weight: 800; font-size: 15px; text-align: center;
    background: var(--card2); border: 1px solid var(--line); }
  .btn.primary { background: var(--yellow); color: var(--ink); border-color: var(--yellow); }
  .btn.wide { grid-column: 1 / -1; }
  .btn:disabled { opacity: .4; }

  .form h2 { font-size: 22px; font-weight: 900; margin: 6px 0 4px; }
  .form > p { color: var(--muted); margin: 0 0 16px; font-size: 14px; }
  label { display: block; font-size: 13px; font-weight: 700; color: var(--muted); margin: 12px 0 6px; }
  .field { width: 100%; padding: 13px 14px; border-radius: 12px; border: 1px solid var(--line);
    background: var(--card); outline: none; font-size: 15px; }
  .field:focus { border-color: var(--yellow); }
  textarea.field { min-height: 96px; resize: vertical; }
  .err { color: #ff7a7a; font-size: 13px; margin-top: 10px; min-height: 18px; }
  .hidden { display: none !important; }
</style>
</head>
<body>

<header>
  <div class="brand">
    <svg viewBox="0 0 108 108" aria-hidden="true">
      <path fill="#FFCC00" d="M54,14 C38,14 26,26 26,42 C26,62 54,94 54,94 C54,94 82,62 82,42 C82,26 70,14 54,14 Z"/>
      <circle cx="54" cy="42" r="19" fill="#fff"/>
      <path fill="#1A1A1C" d="M48,33 h12 a2,2 0 0 1 2,2 v3 h5 a2,2 0 0 1 2,2 v11 a2,2 0 0 1 -2,2 h-26 a2,2 0 0 1 -2,-2 v-11 a2,2 0 0 1 2,-2 h5 v-3 a2,2 0 0 1 2,-2 z M50,36 v2 h8 v-2 z"/>
    </svg>
    <div>
      <h1>G‘uzorda <span>Ishla</span></h1>
      <p>G‘uzor tumanidagi ish e’lonlari</p>
    </div>
  </div>
  <div id="filters">
    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Lavozim, ish beruvchi yoki manzil…" autocomplete="off">
    </div>
    <div class="chips" id="chips"></div>
  </div>
</header>

<main>
  <section id="view-list">
    <div class="meta"><span id="count"></span><span id="sync"></span></div>
    <div id="list"></div>
  </section>

  <section id="view-saved" class="hidden">
    <div class="meta"><span>Saqlangan e’lonlar</span></div>
    <div id="saved"></div>
  </section>

  <section id="view-post" class="hidden form">
    <h2>E’lon berish</h2>
    <p>Ish beruvchimisiz? Vakansiyangizni yuboring — minglab nomzodlar ko‘radi!</p>
    <form id="postForm" novalidate>
      <label for="f-title">Lavozim *</label>
      <input class="field" id="f-title" placeholder="Masalan: Sotuvchi">
      <label for="f-company">Ish beruvchi *</label>
      <input class="field" id="f-company" placeholder="Korxona yoki do‘kon nomi">
      <label for="f-cat">Yo‘nalish</label>
      <select class="field" id="f-cat"></select>
      <label for="f-salary">Maosh</label>
      <input class="field" id="f-salary" placeholder="Masalan: 3 000 000 so‘m">
      <label for="f-schedule">Ish grafigi</label>
      <input class="field" id="f-schedule" placeholder="Masalan: 09:00–18:00, to‘liq stavka">
      <label for="f-location">Manzil</label>
      <input class="field" id="f-location" placeholder="Masalan: G‘uzor sh., bozor yonida">
      <label for="f-desc">Talablar va tavsif</label>
      <textarea class="field" id="f-desc" placeholder="Nomzodga qo‘yiladigan talablar, ish sharoitlari…"></textarea>
      <label for="f-phone">Aloqa telefoni *</label>
      <input class="field" id="f-phone" type="tel" placeholder="+998 __ ___ __ __">
      <div class="err" id="f-err"></div>
      <div class="actions">
        <button class="btn primary wide" type="submit" id="f-send">E’lonni yuborish</button>
      </div>
    </form>
  </section>
</main>

<nav>
  <button data-view="list" class="on">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"/></svg>
    E’lonlar
  </button>
  <button data-view="saved">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v18l-6-4-6 4z"/></svg>
    Saqlanganlar
  </button>
  <button data-view="post">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>
    E’lon berish
  </button>
</nav>

<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>

<script src="jobs.js"></script>
<script>
(function () {
  "use strict";
  var REMOTE_URL = "https://raw.githubusercontent.com/rquyliyev72-netizen/G-UZOR-ADS/HEAD/app-data/jobs.json";
  var CATS = ["Barchasi", "Savdo", "Transport", "Oshxona", "Ofis", "Qurilish", "Ta’lim", "Boshqa"];
  var MONTHS = ["yanvar", "fevral", "mart", "aprel", "may", "iyun", "iyul", "avgust", "sentabr", "oktabr", "noyabr", "dekabr"];

  var store = {
    get: function (k, d) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
    set: function (k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  };
  var data = store.get("gi_data", null) || window.BUNDLED_DATA || { jobs: [], config: {} };
  var saved = store.get("gi_saved", []);
  var state = { cat: "Barchasi", q: "", view: "list" };
  var $ = function (id) { return document.getElementById(id); };
  var native = window.Android || null;

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function toast(t) { if (native) native.toast(t); else console.log(t); }
  function openUrl(u) { if (native) native.open(u); else window.open(u, "_blank"); }
  function share(text) {
    if (native) native.share(text);
    else if (navigator.share) navigator.share({ text: text });
    else { navigator.clipboard && navigator.clipboard.writeText(text); toast("Nusxalandi"); }
  }
  function daysAgo(d) {
    var t = Date.parse(d); if (isNaN(t)) return 99;
    return Math.floor((Date.now() - t) / 864e5);
  }
  function fmtDate(d) {
    var n = daysAgo(d);
    if (n <= 0) return "Bugun";
    if (n === 1) return "Kecha";
    if (n < 7) return n + " kun oldin";
    var x = new Date(d); if (isNaN(x)) return "";
    return x.getDate() + "-" + MONTHS[x.getMonth()];
  }
  function norm(s) { return String(s || "").toLowerCase().replace(/[‘’ʻʼ'`]/g, "'"); }
  function jobs() {
    return (data.jobs || []).slice().sort(function (a, b) { return (Date.parse(b.date) || 0) - (Date.parse(a.date) || 0); });
  }
  function byId(id) { return (data.jobs || []).filter(function (j) { return String(j.id) === String(id); })[0]; }

  function card(j) {
    var badge = j.namuna ? '<span class="badge sample">NAMUNA</span>'
      : (daysAgo(j.date) <= 3 ? '<span class="badge">YANGI</span>' : "");
    var tags = [j.schedule, j.location, fmtDate(j.date)].filter(Boolean)
      .map(function (t) { return '<span class="tag">' + esc(t) + "</span>"; }).join("");
    return '<button class="job" data-id="' + esc(j.id) + '">' + badge +
      "<h3>" + esc(j.title) + '</h3><div class="co">' + esc(j.company) + "</div>" +
      (j.salary ? '<div class="salary">' + esc(j.salary) + "</div>" : '<div style="height:10px"></div>') +
      '<div class="tags">' + tags + "</div></button>";
  }

  function renderChips() {
    $("chips").innerHTML = CATS.map(function (c) {
      return '<button class="chip' + (c === state.cat ? " on" : "") + '" data-cat="' + esc(c) + '">' + esc(c) + "</button>";
    }).join("");
  }

  function renderList() {
    var q = norm(state.q.trim());
    var list = jobs().filter(function (j) {
      if (state.cat !== "Barchasi" && j.category !== state.cat) return false;
      if (!q) return true;
      return norm([j.title, j.company, j.location, j.category, j.description].join(" ")).indexOf(q) !== -1;
    });
    $("count").textContent = list.length + " ta vakansiya";
    $("list").innerHTML = list.length ? list.map(card).join("")
      : '<div class="empty"><b>Hech narsa topilmadi</b>Boshqa so‘z bilan qidirib ko‘ring yoki yo‘nalishni o‘zgartiring.</div>';
  }

  function renderSaved() {
    var list = saved.map(byId).filter(Boolean);
    $("saved").innerHTML = list.length ? list.map(card).join("")
      : '<div class="empty"><b>Hozircha bo‘sh</b>E’lonni ochib, “Saqlash” tugmasini bosing — u shu yerda turadi.</div>';
  }

  function shareText(j) {
    return "📌 " + j.title + "\n🏢 " + j.company +
      (j.salary ? "\n💰 " + j.salary : "") + (j.schedule ? "\n🕘 " + j.schedule : "") +
      (j.location ? "\n📍 " + j.location : "") + (j.phone ? "\n📞 " + j.phone : "") +
      "\n\nG‘uzorda Ishla — G‘uzor tumanidagi ish e’lonlari";
  }

  function openJob(id) {
    var j = byId(id); if (!j) return;
    var isSaved = saved.indexOf(String(j.id)) !== -1;
    var rows = [["Maosh", j.salary], ["Ish grafigi", j.schedule], ["Manzil", j.location], ["E’lon sanasi", fmtDate(j.date)]]
      .filter(function (r) { return r[1]; })
      .map(function (r) { return '<div class="row"><div><small>' + r[0] + "</small>" + esc(r[1]) + "</div></div>"; }).join("");
    var reqs = (j.requirements || []).map(function (r) { return "<li>" + esc(r) + "</li>"; }).join("");
    var tg = String(j.telegram || "").replace(/^@/, "");
    $("sheet").innerHTML = '<div class="grip"></div><h2>' + esc(j.title) + '</h2><div class="co">' + esc(j.company) + "</div>" +
      '<div class="rows">' + rows + "</div>" +
      (j.description ? "<h4>Ish haqida</h4><p>" + esc(j.description) + "</p>" : "") +
      (reqs ? "<h4>Talablar</h4><ul>" + reqs + "</ul>" : "") +
      (j.namuna ? '<div class="note">Bu namuna e’lon. Haqiqiy e’lonlar tez orada qo‘shiladi.</div>' : "") +
      '<div class="actions">' +
      '<button class="btn primary" data-act="call"' + (j.phone ? "" : " disabled") + ">📞 Qo‘ng‘iroq</button>" +
      '<button class="btn" data-act="tg"' + (tg ? "" : " disabled") + ">✈️ Telegram</button>" +
      '<button class="btn" data-act="save">' + (isSaved ? "★ Saqlangan" : "☆ Saqlash") + "</button>" +
      '<button class="btn" data-act="share">↗ Ulashish</button></div>';
    $("sheet").onclick = function (e) {
      var b = e.target.closest("[data-act]"); if (!b || b.disabled) return;
      var a = b.getAttribute("data-act");
      if (a === "call") openUrl("tel:" + String(j.phone).replace(/[^\d+]/g, ""));
      if (a === "tg") openUrl("https://t.me/" + encodeURIComponent(tg));
      if (a === "share") share(shareText(j));
      if (a === "save") {
        var k = String(j.id), i = saved.indexOf(k);
        if (i === -1) { saved.push(k); toast("Saqlandi"); } else { saved.splice(i, 1); toast("Olib tashlandi"); }
        store.set("gi_saved", saved);
        b.textContent = i === -1 ? "★ Saqlangan" : "☆ Saqlash";
        renderSaved();
      }
    };
    $("sheet").scrollTop = 0;
    $("sheet").classList.add("open"); $("sheetBg").classList.add("open");
  }
  function closeSheet() {
    var open = $("sheet").classList.contains("open");
    $("sheet").classList.remove("open"); $("sheetBg").classList.remove("open");
    return open;
  }

  function setView(v) {
    state.view = v;
    ["list", "saved", "post"].forEach(function (n) { $("view-" + n).classList.toggle("hidden", n !== v); });
    $("filters").classList.toggle("hidden", v !== "list");
    document.querySelectorAll("nav button").forEach(function (b) { b.classList.toggle("on", b.getAttribute("data-view") === v); });
    if (v === "saved") renderSaved();
    window.scrollTo(0, 0);
  }

  // Android "orqaga" tugmasi: avval oynani yopadi, keyin bosh sahifaga qaytaradi
  window.appBack = function () {
    if (closeSheet()) return true;
    if (state.view !== "list") { setView("list"); return true; }
    return false;
  };

  // --- E'lon berish ---
  $("f-cat").innerHTML = CATS.slice(1).map(function (c) { return "<option>" + esc(c) + "</option>"; }).join("");
  $("postForm").addEventListener("submit", function (e) {
    e.preventDefault();
    var v = function (id) { return $(id).value.trim(); };
    var phoneDigits = v("f-phone").replace(/\D/g, "");
    if (!v("f-title") || !v("f-company")) { $("f-err").textContent = "Lavozim va ish beruvchi nomini kiriting."; return; }
    if (phoneDigits.length < 9) { $("f-err").textContent = "Telefon raqamini to‘liq kiriting."; return; }
    $("f-err").textContent = "";
    var text = "🆕 YANGI VAKANSIYA\n\n📌 Lavozim: " + v("f-title") + "\n🏢 Ish beruvchi: " + v("f-company") +
      "\n🗂 Yo‘nalish: " + v("f-cat") +
      (v("f-salary") ? "\n💰 Maosh: " + v("f-salary") : "") +
      (v("f-schedule") ? "\n🕘 Grafik: " + v("f-schedule") : "") +
      (v("f-location") ? "\n📍 Manzil: " + v("f-location") : "") +
      (v("f-desc") ? "\n\n📝 " + v("f-desc") : "") +
      "\n\n📞 Aloqa: " + v("f-phone");
    var admin = String((data.config || {}).adminTelegram || "").replace(/^@/, "");
    if (admin) toast("Telegram'da @" + admin + " ga yuboring");
    share(text);
  });

  // --- Hodisalar ---
  $("q").addEventListener("input", function (e) { state.q = e.target.value; renderList(); });
  $("chips").addEventListener("click", function (e) {
    var c = e.target.closest("[data-cat]"); if (!c) return;
    state.cat = c.getAttribute("data-cat"); renderChips(); renderList();
  });
  document.addEventListener("click", function (e) {
    var j = e.target.closest(".job"); if (j) openJob(j.getAttribute("data-id"));
    var n = e.target.closest("nav button"); if (n) setView(n.getAttribute("data-view"));
  });
  $("sheetBg").addEventListener("click", closeSheet);

  // --- Internetdan yangi e'lonlarni yuklash (bo'lmasa saqlangan/ichki ma'lumot ishlaydi) ---
  function sync() {
    if (!window.fetch) return;
    $("sync").textContent = "Yangilanmoqda…";
    fetch(REMOTE_URL + "?t=" + Date.now(), { cache: "no-store" })
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function (d) {
        if (!d || !Array.isArray(d.jobs)) throw new Error("bad data");
        data = d; store.set("gi_data", d);
        $("sync").textContent = "Yangilandi"; renderList(); renderSaved();
      })
      .catch(function () { $("sync").textContent = "Oflayn rejim"; });
  }

  renderChips(); renderList(); sync();
})();
</script>
</body>
</html>
