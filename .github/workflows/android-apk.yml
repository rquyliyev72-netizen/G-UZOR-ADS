name: G'uzorda Ishla APK

on:
  push:
    paths:
      - "guzorda-ishla-app/**"
      - "app-data/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: guzorda-ishla-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: E'lonlar faylini ilovaga joylash
        run: |
          { printf 'window.BUNDLED_DATA = '; cat ../app-data/jobs.json; printf ';\n'; } > app/src/main/assets/www/jobs.js

      - name: Imzo kalitini tayyorlash (agar Secrets'da bo'lsa)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi

      - name: APK yig'ish
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          gradle assembleRelease --no-daemon --stacktrace
          mkdir -p ../dist
          cp app/build/outputs/apk/release/app-release.apk ../dist/GuzordaIshla-v1.0.${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: GuzordaIshla-apk
          path: dist/*.apk

      - name: Release'ga APK'ni joylash
        uses: softprops/action-gh-release@v2
        with:
          tag_name: guzorda-ishla-v1.0.${{ github.run_number }}
          name: G'uzorda Ishla v1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          body: |
            G'uzorda Ishla Android ilovasi. Telefoningizda APK faylni yuklab oling va o'rnating
            (kerak bo'lsa "Noma'lum manbalardan o'rnatish"ga ruxsat bering).
          files: dist/*.apk
